apiVersion: oci.oraclecloud.com/v1alpha1
kind: OCINodeClass
metadata:
  name: oci-node
spec:
  shapeConfigs:
    - ocpus: 1
      memoryInGbs: 8
  volumeConfig:
    bootVolumeConfig:
      sizeInGBs: 100
      vpusPerGB: 10
      pvEncryptionInTransit: true
      imageConfig:
        imageType: OKEImage
        imageFilter:
          osFilter: "Oracle Linux"
          osVersionFilter: "8"  # see OCINodeClass docs for imageFilter behavior
  networkConfig:
    primaryVnicConfig:
      subnetConfig:
        subnetId: "ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaadg2a5ghugyjctvblad23r735r7fn33wofakwpiqvwftemsgtobra"
      networkSecurityGroupConfigs:
        - networkSecurityGroupId: "ocid1.networksecuritygroup.oc1.eu-frankfurt-1.aaaaaaaaynuhfktcsud4cbaykho57u6svxwwicd5ilrixc67n5q3hu4k655q"
    secondaryVnicConfigs:
      - subnetConfig:
          subnetId: "ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaacn6qhvhx5q32zeguf6uyehx3kt66o6in4f5fmkejt5n57idtac5a"
        networkSecurityGroupConfigs:
          - networkSecurityGroupId: "ocid1.networksecuritygroup.oc1.eu-frankfurt-1.aaaaaaaaaop7xrbqqzr36fr77flojwiu7locutszbueioyqits5zay4k2fxa"
        ipCount: 16
  kubeletConfig:
    maxPods: 30
    evictionMaxPodGracePeriod: 15